<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>campusTasks · 校园任务管理</title>
  <meta name="description" content="campusTasks —— 面向大学生的校园任务管理器（原生 HTML/CSS/JS，零依赖）" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">

    <!-- ==================== 头部 ==================== -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">CT</span>
        <div class="brand-text">
          <h1>campusTasks</h1>
          <p>校园任务管理 · 作业、实验、考试一个都不落</p>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-new-task" type="button">
        <span class="btn-plus" aria-hidden="true">+</span> 新建任务
      </button>
    </header>

    <!-- ==================== 概览统计 ==================== -->
    <section class="stats" aria-label="任务概览">
      <div class="stat stat-todo">
        <span class="stat-num" id="stat-todo">0</span>
        <span class="stat-label">待办</span>
      </div>
      <div class="stat stat-today">
        <span class="stat-num" id="stat-today">0</span>
        <span class="stat-label">今日到期</span>
      </div>
      <div class="stat stat-overdue">
        <span class="stat-num" id="stat-overdue">0</span>
        <span class="stat-label">已逾期</span>
      </div>
      <div class="stat stat-weekdone">
        <span class="stat-num" id="stat-weekdone">0</span>
        <span class="stat-label">本周完成</span>
      </div>
    </section>

    <!-- ==================== 视图切换 ==================== -->
    <nav class="view-tabs" id="view-tabs" aria-label="视图切换">
      <button class="tab is-active" type="button" data-view="list" aria-selected="true">列表</button>
      <button class="tab" type="button" data-view="group" aria-selected="false">按课程分组</button>
      <button class="tab" type="button" data-view="board" aria-selected="false">看板</button>
    </nav>

    <!-- ==================== 工具栏 ==================== -->
    <section class="toolbar" aria-label="筛选与搜索">
      <div class="field field-inline" id="field-filter-course">
        <label for="filter-course">课程</label>
        <select id="filter-course">
          <option value="all">全部课程</option>
        </select>
      </div>

      <div class="field field-inline" id="field-filter-type">
        <label for="filter-type">类型</label>
        <select id="filter-type">
          <option value="all">全部类型</option>
        </select>
      </div>

      <div class="field field-inline" id="field-filter-status">
        <label for="filter-status">状态</label>
        <select id="filter-status">
          <option value="unfinished">未完成</option>
          <option value="all">全部</option>
          <option value="todo">待办</option>
          <option value="doing">进行中</option>
          <option value="done">已完成</option>
        </select>
      </div>

      <div class="field field-inline field-search">
        <label for="search-keyword">搜索</label>
        <input id="search-keyword" type="search" placeholder="搜索标题或备注…" autocomplete="off" />
      </div>

      <div class="toolbar-actions">
        <button class="btn btn-ghost" id="btn-import" type="button">导入</button>
        <button class="btn btn-ghost" id="btn-export" type="button">导出</button>
        <input type="file" id="file-import" accept=".json,application/json" hidden />
      </div>
    </section>

    <!-- ==================== 三个视图容器 ==================== -->
    <div class="views">
      <section class="view is-active" id="view-list" aria-label="任务列表"></section>
      <section class="view" id="view-group" aria-label="按课程分组"></section>
      <section class="view" id="view-board" aria-label="看板"></section>
    </div>

  </main>

  <!-- ==================== 任务表单弹窗（新建与编辑共用） ==================== -->
  <dialog class="dlg" id="dlg-task" aria-labelledby="dlg-task-title">
    <form class="dlg-form" id="form-task" novalidate>
      <h2 class="dlg-title" id="dlg-task-title">新建任务</h2>

      <div class="field">
        <label for="f-title">标题 <span class="req" aria-hidden="true">*</span></label>
        <input id="f-title" name="title" type="text" maxlength="80"
               placeholder="例如：数据结构第3次作业" autocomplete="off" />
        <p class="field-error" id="err-title" hidden></p>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-course">课程</label>
          <input id="f-course" name="course" type="text" maxlength="30"
                 list="course-list" placeholder="例如：数据结构" autocomplete="off" />
          <datalist id="course-list"></datalist>
        </div>
        <div class="field">
          <label for="f-type">类型</label>
          <select id="f-type" name="type"></select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-due">截止时间</label>
          <input id="f-due" name="dueAt" type="datetime-local" />
        </div>
        <div class="field">
          <label for="f-priority">优先级</label>
          <select id="f-priority" name="priority"></select>
        </div>
      </div>

      <div class="field">
        <label for="f-status">状态</label>
        <select id="f-status" name="status"></select>
      </div>

      <div class="field">
        <label for="f-note">备注</label>
        <textarea id="f-note" name="note" rows="3" maxlength="200"
                  placeholder="补充说明，例如：第三章 树与二叉树"></textarea>
      </div>

      <div class="dlg-actions">
        <button class="btn" id="btn-cancel-task" type="button">取消</button>
        <button class="btn btn-primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <!-- ==================== 确认弹窗 ==================== -->
  <dialog class="dlg dlg-sm" id="dlg-confirm" aria-labelledby="dlg-confirm-title">
    <h2 class="dlg-title" id="dlg-confirm-title">确认</h2>
    <p class="dlg-msg" id="dlg-confirm-msg"></p>
    <div class="dlg-actions">
      <button class="btn" id="btn-confirm-cancel" type="button">取消</button>
      <button class="btn btn-danger" id="btn-confirm-ok" type="button">确定</button>
    </div>
  </dialog>

  <!-- ==================== 提示条 ==================== -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p style="padding:24px;text-align:center;">campusTasks 需要启用 JavaScript 才能使用。</p>
  </noscript>

  <!-- 经典 script 标签：不使用 ES Module，保证 file:// 下也能加载 -->
  <script src="js/app.js"></script>
</body>
</html>
