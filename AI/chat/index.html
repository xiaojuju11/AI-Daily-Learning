<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat - 多模态助手</title>
  <link rel="stylesheet" href="style.css">
  <!-- highlight.js 代码高亮 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
</head>
<body>
  <!-- ========== 侧边栏 ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="btn-new-chat" id="btnNewChat" title="新建对话">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>新建对话</span>
      </button>
    </div>
    <div class="conversation-list" id="conversationList">
      <!-- 动态渲染 -->
    </div>
    <div class="sidebar-footer">
      <button class="btn-settings" id="btnSettings" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
        <span>设置</span>
      </button>
      <button class="btn-toggle-sidebar" id="btnToggleSidebar" title="收起侧边栏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
    </div>
  </aside>

  <!-- ========== 主区域 ========== -->
  <main class="main" id="main">
    <!-- 欢迎页 -->
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-content">
        <h1 class="welcome-title">
          <span class="logo-icon">✨</span>
          AI 多模态助手
        </h1>
        <p class="welcome-subtitle">基于 Qwen3.6-27B · 支持文本和图片理解</p>
        <div class="suggestion-cards">
          <div class="suggestion-card" data-prompt="请用简单易懂的方式解释什么是量子计算？">
            <div class="card-icon">🧠</div>
            <div class="card-text">用简单易懂的方式解释量子计算</div>
          </div>
          <div class="suggestion-card" data-prompt="帮我写一段 Python 代码，实现快速排序算法">
            <div class="card-icon">💻</div>
            <div class="card-text">写一段 Python 快速排序代码</div>
          </div>
          <div class="suggestion-card" data-prompt="请帮我分析这张图片中的内容">
            <div class="card-icon">🖼️</div>
            <div class="card-text">分析图片中的内容（可上传图片）</div>
          </div>
          <div class="suggestion-card" data-prompt="请用表格形式对比 Python 和 JavaScript 的主要区别">
            <div class="card-icon">📊</div>
            <div class="card-text">对比 Python 和 JavaScript 的区别</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 消息区域 -->
    <div class="chat-area" id="chatArea" style="display:none;">
      <div class="messages" id="messagesContainer">
        <!-- 动态渲染 -->
      </div>
    </div>

    <!-- 底部输入区域 -->
    <div class="input-area" id="inputArea">
      <div class="image-preview-bar" id="imagePreviewBar">
        <!-- 图片预览缩略图 -->
      </div>
      <div class="input-wrapper">
        <div class="input-row">
          <button class="btn-upload" id="btnUpload" title="上传图片">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </button>
          <input type="file" id="fileInput" accept="image/*" multiple hidden>
          <textarea
            id="messageInput"
            class="message-input"
            placeholder="输入消息，支持粘贴图片..."
            rows="1"
            autofocus
          ></textarea>
          <button class="btn-send" id="btnSend" title="发送消息">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
          </button>
          <button class="btn-stop" id="btnStop" title="停止生成" style="display:none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"></rect>
            </svg>
          </button>
        </div>
        <p class="input-hint">Enter 发送 · Shift+Enter 换行 · Ctrl+V 粘贴图片</p>
      </div>
    </div>
  </main>

  <!-- ========== 设置弹窗 ========== -->
  <div class="modal-overlay" id="settingsModal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2>⚙️ 设置</h2>
        <button class="btn-close" id="btnCloseSettings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="apiKey">API Key</label>
          <input type="password" id="apiKey" class="form-input" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx">
          <p class="form-hint">在<a href="https://cloud.siliconflow.cn" target="_blank" rel="noopener">硅基流动</a>获取 API Key，仅保存在浏览器本地</p>
        </div>
        <div class="form-group">
          <label for="modelSelect">模型</label>
          <select id="modelSelect" class="form-input">
            <option value="Qwen/Qwen3.6-27B">Qwen/Qwen3.6-27B (推荐)</option>
            <option value="Qwen/Qwen3.6-35B-A3B">Qwen/Qwen3.6-35B-A3B (MoE)</option>
            <option value="Qwen/Qwen2.5-VL-72B-Instruct">Qwen/Qwen2.5-VL-72B-Instruct</option>
            <option value="Qwen/Qwen2.5-VL-32B-Instruct">Qwen/Qwen2.5-VL-32B-Instruct</option>
            <option value="Qwen/Qwen2.5-VL-7B-Instruct">Qwen/Qwen2.5-VL-7B-Instruct</option>
          </select>
        </div>
        <div class="form-group">
          <label for="temperature">Temperature: <span id="tempValue">0.7</span></label>
          <input type="range" id="temperature" class="form-range" min="0" max="2" step="0.1" value="0.7">
        </div>
        <div class="form-group">
          <label for="maxTokens">最大输出长度: <span id="tokensValue">4096</span></label>
          <input type="range" id="maxTokens" class="form-range" min="256" max="8192" step="256" value="4096">
        </div>
        <div class="form-group">
          <label class="toggle-label">
            <input type="checkbox" id="thinkingMode">
            <span class="toggle-switch"></span>
            <span>Thinking 模式（让模型先思考再回答）</span>
          </label>
        </div>
        <div class="form-group">
          <label class="toggle-label">
            <input type="checkbox" id="darkMode">
            <span class="toggle-switch"></span>
            <span>深色模式（默认开启）</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnResetSettings">恢复默认</button>
        <button class="btn btn-primary" id="btnSaveSettings">保存设置</button>
      </div>
    </div>
  </div>

  <!-- ========== API Key 引导弹窗 ========== -->
  <div class="modal-overlay" id="apiKeyModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>🔑 欢迎使用 AI 多模态助手</h2>
      </div>
      <div class="modal-body">
        <p class="welcome-text">请输入硅基流动 API Key 以开始使用：</p>
        <div class="form-group">
          <input type="password" id="apiKeyWelcome" class="form-input" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx">
          <p class="form-hint">
            前往 <a href="https://cloud.siliconflow.cn/account/ak" target="_blank" rel="noopener">硅基流动控制台</a> 获取 API Key
          </p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary btn-full" id="btnConfirmApiKey">开始使用</button>
      </div>
    </div>
  </div>

  <!-- ========== 确认删除弹窗 ========== -->
  <div class="modal-overlay" id="confirmModal" style="display:none;">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>删除对话</h2>
        <button class="btn-close" id="btnCloseConfirm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p>确定要删除这个对话吗？此操作不可撤销。</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCancelDelete">取消</button>
        <button class="btn btn-danger" id="btnConfirmDelete">删除</button>
      </div>
    </div>
  </div>

  <!-- ========== Toast ========== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- JS 库 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
