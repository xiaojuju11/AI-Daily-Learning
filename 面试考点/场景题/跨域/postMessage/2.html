<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h3>我是子页面</h3>
  <p id="msg"></p>

  <script>
    window.onmessage = function (e) {
      document.getElementById('msg').innerHTML = JSON.parse(e.data).name

      setTimeout(() => {
        let { age } = JSON.parse(e.data)
        age++
        e.source.postMessage(JSON.stringify({age}), e.origin)
      }, 3000)
    }
  </script>
</body>
</html>
