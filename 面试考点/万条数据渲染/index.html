<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="list"></ul>
    <script>
        const data = new Array(10000).fill(0).map((item, index) => {
            return {
                id: index,
                name: `name${index}`
            }
        })

        const startTime = Date.now()
        for(let i = 0; i < data.length; i++){
            const item = data[i]
            const li = document.createElement('li')
            li.innerHTML = item.name
            document.getElementById('list').appendChild(li)
        }
        const endTime = Date.now()
        console.log(`渲染10000条数据耗时${endTime - startTime}ms`)  
        setTimeout(() => {
            console.log(`渲染消耗时间：${Date.now() - endTime}ms`)
        }, 0)
    </script>
</body>
</html>
