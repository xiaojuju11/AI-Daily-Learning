<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;padding: 0;
    }
    .box{
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    .left {
      position: absolute;
      width: 300px;
      left: 0;
      min-height: 200px;
      background-color: #d9ebab;
    }
    .right{
      position: absolute;
      width: calc(100vw - 300px);
      left: 300px;
      height: 200px;
      background-color: #ebbcbc;
    }
    .line{
      height: 100%;
      width: 1px;
      background-color: #000;
      position: absolute;
    }
    .line:hover{
      background-color: #f00;
      cursor: col-resize;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="left">1</div>
    <div class="right">
      <div class="line"></div>
      2
    </div>
  </div>

  <script>
    const line = document.querySelector('.line');
    const box = document.querySelector('.box');
    let isDown = false;
    const right = document.querySelector('.right');
    const left = document.querySelector('.left');

    line.addEventListener('mousedown', (e) => {
      e.preventDefault();
      isDown = true;
    })


    box.addEventListener('mousemove', (e) => {
      e.preventDefault();
      if (!isDown) return;
      console.log(e.pageX);
      right.style.left = e.pageX + 'px';
      left.style.width = e.pageX + 'px';
    })

    box.addEventListener('mouseup', (e) => {
      e.preventDefault();
      isDown = false;
    })
  </script>
</body>
</html>
