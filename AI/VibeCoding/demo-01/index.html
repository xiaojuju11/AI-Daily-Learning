<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学习任务 · TaskFlow</title>
<meta name="description" content="一个清爽的学生学习任务管理器">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>

<div class="glow" aria-hidden="true">
  <span class="glow-a"></span>
  <span class="glow-b"></span>
  <span class="glow-c"></span>
</div>

<div class="app">

  <!-- ── 顶栏 ───────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/>
          <path d="m9 9.5 2 2 4-4"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>学习任务</h1>
        <p id="todayLabel">—</p>
      </div>
    </div>

    <button class="icon-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
  </header>

  <!-- ── 概览 ───────────────────────────────────────── -->
  <section class="overview">
    <div class="ring-card">
      <svg class="ring" viewBox="0 0 88 88" aria-hidden="true">
        <circle class="ring-track" cx="44" cy="44" r="36"/>
        <circle class="ring-fill" id="ringFill" cx="44" cy="44" r="36"/>
      </svg>
      <div class="ring-center">
        <strong id="ringPct">0%</strong>
        <span>完成率</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat" data-tone="accent">
        <span class="stat-label">进行中</span>
        <strong class="stat-value" id="statActive">0</strong>
      </div>
      <div class="stat" data-tone="ok">
        <span class="stat-label">已完成</span>
        <strong class="stat-value" id="statDone">0</strong>
      </div>
      <div class="stat" data-tone="warn">
        <span class="stat-label">今日到期</span>
        <strong class="stat-value" id="statToday">0</strong>
      </div>
      <div class="stat" data-tone="danger">
        <span class="stat-label">已逾期</span>
        <strong class="stat-value" id="statOverdue">0</strong>
      </div>
    </div>
  </section>

  <!-- ── 新建任务 ───────────────────────────────────── -->
  <form class="composer" id="composer" autocomplete="off">
    <div class="composer-main">
      <svg class="composer-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <input type="text" id="newTitle" placeholder="添加一项学习任务…" maxlength="200" aria-label="任务标题">
      <button class="btn-primary" type="submit">
        <span>添加</span>
        <kbd>⏎</kbd>
      </button>
    </div>

    <div class="composer-meta">
      <label class="field">
        <span class="field-label">科目</span>
        <input type="text" id="newSubject" list="subjectList" placeholder="未分类" maxlength="12" aria-label="科目">
        <datalist id="subjectList">
          <option value="语文"></option><option value="数学"></option><option value="英语"></option>
          <option value="物理"></option><option value="化学"></option><option value="生物"></option>
          <option value="历史"></option><option value="地理"></option><option value="政治"></option>
          <option value="编程"></option><option value="阅读"></option>
        </datalist>
      </label>

      <label class="field">
        <span class="field-label">优先级</span>
        <select id="newPriority" aria-label="优先级">
          <option value="high">高</option>
          <option value="mid" selected>中</option>
          <option value="low">低</option>
        </select>
      </label>

      <label class="field field-due">
        <span class="field-label">截止时间</span>
        <input type="datetime-local" id="newDue" aria-label="截止时间">
      </label>

      <div class="quick-due" role="group" aria-label="快捷截止时间">
        <button type="button" class="chip chip-btn" data-quick="0">今天</button>
        <button type="button" class="chip chip-btn" data-quick="1">明天</button>
        <button type="button" class="chip chip-btn" data-quick="2">后天</button>
        <button type="button" class="chip chip-btn" data-quick="-1">清除</button>
      </div>
    </div>
  </form>

  <!-- ── 工具栏 ─────────────────────────────────────── -->
  <div class="toolbar">
    <div class="filters" id="filters" role="tablist">
      <button class="chip" data-filter="all"      role="tab">全部<i></i></button>
      <button class="chip" data-filter="today"    role="tab">今天<i></i></button>
      <button class="chip" data-filter="upcoming" role="tab">待完成<i></i></button>
      <button class="chip" data-filter="overdue"  role="tab">逾期<i></i></button>
      <button class="chip" data-filter="done"     role="tab">已完成<i></i></button>
    </div>

    <div class="tools">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>
        </svg>
        <input type="search" id="search" placeholder="搜索任务" aria-label="搜索任务">
        <kbd>/</kbd>
      </div>

      <select id="sort" class="sort" aria-label="排序方式">
        <option value="smart">智能排序</option>
        <option value="due">按截止时间</option>
        <option value="priority">按优先级</option>
        <option value="created">按创建时间</option>
      </select>
    </div>
  </div>

  <!-- ── 任务列表 ───────────────────────────────────── -->
  <main class="list" id="list"></main>

  <footer class="footer">
    <span id="footerHint">数据保存在本地浏览器中</span>
    <button type="button" class="link-btn" id="clearDone">清除已完成</button>
  </footer>
</div>

<!-- ── 编辑弹窗 ─────────────────────────────────────── -->
<dialog class="modal" id="editModal">
  <form method="dialog" class="modal-card" id="editForm">
    <header class="modal-head">
      <h2>编辑任务</h2>
      <button type="button" class="icon-btn sm" id="editClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <div class="modal-body">
      <label class="field stack">
        <span class="field-label">任务标题</span>
        <input type="text" id="editTitle" maxlength="200" required>
      </label>

      <div class="grid-2">
        <label class="field stack">
          <span class="field-label">科目</span>
          <input type="text" id="editSubject" list="subjectList" maxlength="12" placeholder="未分类">
        </label>
        <label class="field stack">
          <span class="field-label">优先级</span>
          <select id="editPriority">
            <option value="high">高</option>
            <option value="mid">中</option>
            <option value="low">低</option>
          </select>
        </label>
      </div>

      <label class="field stack">
        <span class="field-label">截止时间</span>
        <input type="datetime-local" id="editDue">
      </label>

      <label class="field stack">
        <span class="field-label">备注</span>
        <textarea id="editNote" rows="3" maxlength="500" placeholder="补充说明、资料位置…"></textarea>
      </label>
    </div>

    <footer class="modal-foot">
      <button type="button" class="btn-ghost danger" id="editDelete">删除</button>
      <div class="spacer"></div>
      <button type="button" class="btn-ghost" id="editCancel">取消</button>
      <button type="submit" class="btn-primary"><span>保存</span></button>
    </footer>
  </form>
</dialog>

<!-- 屏幕阅读器专用播报区（不朗读整个列表，只播报状态变化） -->
<p class="sr-only" id="live" role="status" aria-live="polite"></p>

<!-- ── 撤销提示 ─────────────────────────────────────── -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo">撤销</button>
</div>

<script src="app.js"></script>
</body>
</html>
