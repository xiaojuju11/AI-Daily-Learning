<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusTask · 校园任务管理</title>
  <meta name="description" content="CampusTask —— 面向大学生的校园任务管理工具（纯前端 Demo）" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">

    <!-- ============ 头部 ============ -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">CT</span>
        <div class="brand-text">
          <h1>CampusTask</h1>
          <p>校园任务管理 · 作业、复习、项目一个都不落</p>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-new-task" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        新建任务
      </button>
    </header>

    <!-- ============ 概览（同时作为状态筛选器） ============ -->
    <section class="stats" aria-label="任务概览与状态筛选">
      <button class="stat" type="button" data-status="all" aria-pressed="true">
        <span class="stat-label">全部任务</span>
        <span class="stat-value" id="stat-all">0</span>
      </button>
      <button class="stat" type="button" data-status="active" aria-pressed="false">
        <span class="stat-label">待完成</span>
        <span class="stat-value" id="stat-active">0</span>
      </button>
      <button class="stat" type="button" data-status="completed" aria-pressed="false">
        <span class="stat-label">已完成</span>
        <span class="stat-value" id="stat-completed">0</span>
      </button>
    </section>

    <!-- ============ 筛选栏 ============ -->
    <section class="toolbar" aria-label="任务筛选">
      <div class="field-inline">
        <label for="filter-course">课程</label>
        <select id="filter-course">
          <option value="all">全部课程</option>
        </select>
      </div>
      <p class="toolbar-hint" id="toolbar-hint"></p>
      <button class="btn btn-ghost btn-sm" id="btn-clear-filters" type="button" hidden>清除筛选</button>
    </section>

    <!-- ============ 任务列表 ============ -->
    <ul class="task-list" id="task-list" aria-live="polite"></ul>

    <!-- 空状态：一个任务都没有 -->
    <section class="empty" id="empty-none" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg class="icon icon-lg" viewBox="0 0 24 24">
          <path d="M9 4h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2V5a1 1 0 0 1 1-1Z" />
          <path d="M9 12h6M9 16h4" />
        </svg>
      </div>
      <h2>还没有任何任务</h2>
      <p>创建第一个任务，把作业、复习和项目安排得明明白白。</p>
      <button class="btn btn-primary" type="button" data-open-task-modal>创建第一个任务</button>
    </section>

    <!-- 空状态：有任务但筛选后无结果 -->
    <section class="empty" id="empty-no-match" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg class="icon icon-lg" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
      </div>
      <h2>没有符合条件的任务</h2>
      <p>当前筛选条件下没有找到任务，换个课程或状态再看看。</p>
      <button class="btn btn-ghost" type="button" id="btn-clear-filters-2">清除筛选条件</button>
    </section>

    <footer class="app-footer">
      <p>数据保存在浏览器 localStorage 中，刷新不会丢失。</p>
    </footer>
  </main>

  <!-- ============ 新建 / 编辑任务弹窗 ============ -->
  <div class="modal" id="task-modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
      <header class="modal-header">
        <h2 id="task-modal-title">新建任务</h2>
        <button class="icon-btn" type="button" data-close aria-label="关闭">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </header>

      <form class="modal-body" id="task-form" novalidate>
        <div class="form-row">
          <label for="task-title">任务名称 <span class="req">*</span></label>
          <input id="task-title" name="title" type="text" maxlength="60" autocomplete="off"
                 placeholder="例如：软件工程课程设计" />
          <p class="field-error" id="title-error" hidden>请填写任务名称</p>
        </div>

        <div class="form-grid">
          <div class="form-row">
            <label for="task-course">所属课程</label>
            <input id="task-course" name="course" type="text" list="course-options" maxlength="20"
                   autocomplete="off" placeholder="例如：软件工程" />
            <datalist id="course-options"></datalist>
          </div>

          <div class="form-row">
            <label for="task-category">分类</label>
            <input id="task-category" name="category" type="text" list="category-options" maxlength="20"
                   autocomplete="off" placeholder="例如：课程作业" />
            <datalist id="category-options"></datalist>
          </div>

          <div class="form-row">
            <label for="task-due">截止日期</label>
            <input id="task-due" name="dueDate" type="date" />
          </div>

          <div class="form-row">
            <span class="field-label">优先级</span>
            <div class="segmented" role="radiogroup" aria-label="优先级">
              <label class="seg seg-high">
                <input type="radio" name="priority" value="high" />
                <span>高</span>
              </label>
              <label class="seg seg-medium">
                <input type="radio" name="priority" value="medium" checked />
                <span>中</span>
              </label>
              <label class="seg seg-low">
                <input type="radio" name="priority" value="low" />
                <span>低</span>
              </label>
            </div>
          </div>
        </div>

        <footer class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close>取消</button>
          <button type="submit" class="btn btn-primary" id="btn-save-task">保存任务</button>
        </footer>
      </form>
    </div>
  </div>

  <!-- ============ 删除确认弹窗 ============ -->
  <div class="modal" id="confirm-modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel modal-panel-sm" role="alertdialog" aria-modal="true"
         aria-labelledby="confirm-title" aria-describedby="confirm-desc" tabindex="-1">
      <header class="modal-header">
        <h2 id="confirm-title">删除任务</h2>
      </header>
      <div class="modal-body">
        <p class="confirm-text" id="confirm-desc"></p>
        <footer class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close>取消</button>
          <button type="button" class="btn btn-danger" id="btn-confirm-delete">确认删除</button>
        </footer>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
