<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .list{
            list-style: none;
            font-size: 0;
        }
        li{
            width: 300px;
            height: 100px;
            font-size: 20px;
            text-align: center;
            float: left;
        }
        li:nth-child(1){
            background-color: red;
        }
        li:nth-child(2){
            background-color: green;
        }
        li:nth-child(3){
            background-color: yellow;
        }
        h2{
            width: 100px;
            height: 150px;
            background-color: pink;
        }
        /* .list::after{
            content: "hello";
            display: block;
            clear: both;
        } */

        h2{
            clear: both;
        }
    </style>
</head>
<body>
    <ul class="list">
        <li >1</li>
        <li>2</li>
        <li>3</li>

    </ul>
    <h2></h2>
     <!-- <img width="200" height="200" src="https://p1.ssl.qhimgs1.com/sdr/400__/t04cb0ffcd8d9494921.jpg" alt=""> -->
</body>
</html>
